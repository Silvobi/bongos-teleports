plugins { id 'net.fabricmc.fabric-loom' version '1.17.12' }
version = '1.5.0'
group = 'pl.bongo'
base { archivesName = 'BongosTeleports' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources { filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('verificationJar', Jar) {
    dependsOn verificationClasses
    archiveFileName = 'teleports-verification.jar'
    from sourceSets.verification.output
}
def stageVerificationMods = {
    // Headless offline test clients must not depend on the external Mojang account lookup.
    fileTree('verification-server/mods') { include 'BongoUtils-*.jar' }.each { auth ->
        def backup=layout.projectDirectory.dir('verification-server/external-auth-mods').asFile
        backup.mkdirs()
        java.nio.file.Files.move(auth.toPath(),new File(backup,auth.name).toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    fileTree('verification-server/mods') { include 'BongosTeleports-*.jar' }.each { old ->
        if(old.name != tasks.jar.archiveFile.get().asFile.name) {
            def backup = layout.projectDirectory.dir('verification-server/old-teleports').asFile
            backup.mkdirs()
            java.nio.file.Files.move(old.toPath(),new File(backup,old.name).toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
    copy {
        from tasks.jar.archiveFile
        from tasks.verificationJar.archiveFile
        into layout.projectDirectory.dir('verification-server/mods')
    }
}
tasks.register('integrationTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.IntegrationHarness'
    args layout.projectDirectory.dir('verification-server').asFile.absolutePath
    doFirst { stageVerificationMods() }
}
tasks.register('durabilityTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.DurabilityHarness'
    args layout.projectDirectory.dir('verification-server').asFile.absolutePath
    doFirst { stageVerificationMods() }
}
tasks.register('feedbackTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.FeedbackHarness'
    args layout.projectDirectory.dir('verification-server').asFile.absolutePath
    doFirst { stageVerificationMods() }
}
tasks.register('languageTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.LanguageHarness'
    args layout.projectDirectory.dir('verification-server').asFile.absolutePath
    doFirst { stageVerificationMods() }
}

tasks.register('claimProtectionTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.ClaimProtectionHarness'
    args layout.projectDirectory.dir('verification-server').asFile.absolutePath
    doFirst {
        if (!fileTree('verification-server/mods') { include 'GriefPrevention3D*.jar' }.files)
            throw new GradleException('Place the universal GriefPrevention3D 19.0.0 jar in verification-server/mods first.')
        stageVerificationMods()
    }
}

tasks.register('sharedClaimsTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.SharedClaimsHarness'
    args layout.projectDirectory.dir('verification-allmods').asFile.absolutePath
    doFirst {
        if (!file('verification-allmods/claim-suite-fixture.txt').exists())
            throw new GradleException('Prepare the isolated verification-allmods fixture server first.')
        fileTree('verification-allmods/mods') { include 'BongosTeleports-*.jar' }.each { delete it }
        copy { from tasks.jar.archiveFile; from tasks.verificationJar.archiveFile; into 'verification-allmods/mods' }
    }
}

tasks.register('sharedClaimsWithoutGpTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.SharedClaimsHarness'
    args layout.projectDirectory.dir('verification-allmods').asFile.absolutePath, 'no-gp'
    doFirst {
        if (fileTree('verification-allmods/mods') { include 'GriefPrevention3D*.jar' }.files)
            throw new GradleException('Move GP3D out of the isolated fixture mods directory for this test.')
        copy { from tasks.jar.archiveFile; from tasks.verificationJar.archiveFile; into 'verification-allmods/mods' }
    }
}

tasks.register('sharedClaimsWithoutUtilsTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.SharedClaimsHarness'
    args layout.projectDirectory.dir('verification-allmods').asFile.absolutePath, 'without-utils'
    doFirst {
        if (fileTree('verification-allmods/mods') { include 'BongoUtils-*.jar' }.files)
            throw new GradleException('Move BongoUtils out of the isolated fixture mods directory for this test.')
        copy { from tasks.jar.archiveFile; from tasks.verificationJar.archiveFile; into 'verification-allmods/mods' }
    }
}

// Social features are tested against BongoUtils + clans + GP3D on the same isolated vanilla fixture.
tasks.register('socialFeaturesTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.SocialFeaturesHarness'
    args layout.projectDirectory.dir('verification-allmods').asFile.absolutePath
    if(project.hasProperty('socialStandalone')) args 'standalone'
    doFirst {
        if (!file('verification-allmods/claim-suite-fixture.txt').exists())
            throw new GradleException('Prepare the isolated verification-allmods fixture server first.')
        copy { from tasks.jar.archiveFile; from tasks.verificationJar.archiveFile; into 'verification-allmods/mods' }
    }
}

tasks.register('utilsLocalizationTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.UtilsLocalizationHarness'
    args layout.projectDirectory.dir('verification-allmods').asFile.absolutePath
    doFirst {
        if (!file('verification-allmods/claim-suite-fixture.txt').exists())
            throw new GradleException('Prepare the isolated verification-allmods fixture server first.')
        copy { from tasks.jar.archiveFile; from tasks.verificationJar.archiveFile; into 'verification-allmods/mods' }
    }
}

tasks.register('clanTagCompatibilityTest', JavaExec) {
    dependsOn testClasses, jar, verificationJar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'pl.bongo.teleports.ClanTagCompatibilityHarness'
    args layout.projectDirectory.dir('verification-allmods').asFile.absolutePath,
        project.findProperty('previousClansJar') ?: '', project.findProperty('fixedClansJar') ?: ''
    doFirst {
        if (!file('verification-allmods/claim-suite-fixture.txt').exists() || !project.hasProperty('previousClansJar') || !project.hasProperty('fixedClansJar'))
            throw new GradleException('Use the isolated fixture and supply -PpreviousClansJar=... and -PfixedClansJar=...')
        copy { from tasks.jar.archiveFile; from tasks.verificationJar.archiveFile; into 'verification-allmods/mods' }
    }
}
